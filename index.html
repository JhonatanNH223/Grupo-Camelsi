<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/SLogin.css">
</head>

<body>
    <div class="contenedor">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Iniciar sesión</h2>
                <p class="card-description">Ingrese sus credenciales para acceder al sistema</p>
            </div>
            <div class="card-content">
                <form id="loginForm" method="post" action="php/Login/acceso.php">
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <input id="username" name="username" type="text" placeholder="Ingrese su nombre de usuario">
                    </div>
                    <br>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input id="password" name="password" type="password" placeholder="Ingrese su contraseña">
                    </div>
                    <br>
                    <button type="submit" class="button">Iniciar sesión</button>
                </form>
            </div>
            <div class="card-footer">
                <p class="footer-text">¿Olvidó su contraseña? Contacte al administrador.</p>
            </div>
        </div>
    </div>



    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/Login.js"></script>
    <script src="js/sweetalert2.js"></script>
</body>

</html>
